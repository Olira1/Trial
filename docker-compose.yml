services:
  migrate:
    build:
      context: .
      target: build
    command: pnpm db:migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ubel}:${POSTGRES_PASSWORD:-ubel}@postgres:5432/${POSTGRES_DB:-ubel}
    networks:
      - ubel
    depends_on:
      postgres:
        condition: service_healthy

  server:
    container_name: ubel-backend
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ubel}:${POSTGRES_PASSWORD:-ubel}@postgres:5432/${POSTGRES_DB:-ubel}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - 3000:3000
    networks:
      - ubel
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:18-3.6
    platform: ${POSTGRES_PLATFORM:-linux/arm64}
    container_name: ubel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ubel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ubel}
      POSTGRES_DB: ${POSTGRES_DB:-ubel}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PG 18+ stores data under a major-version subdir; mount the parent dir
      # so `pg_upgrade --link` works without mount-point boundary issues.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ubel
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-ubel} -d ${POSTGRES_DB:-ubel}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.2-alpine
    container_name: ubel-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    networks:
      - ubel
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  ubel:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
